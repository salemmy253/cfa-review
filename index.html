  const form = document.getElementById('unlock-form');
  const input = document.getElementById('password');
  const button = document.getElementById('unlock-button');
  const message = document.getElementById('message');

  const bytesFromBase64 = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
  const showError = text => { message.textContent = text; button.disabled = false; button.textContent = '解锁题库'; };

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!window.crypto?.subtle) { showError('当前浏览器不支持 Web Crypto。请通过 HTTPS 的 GitHub Pages 使用 Safari 或 Chrome 打开。'); return; }
    const password = input.value;
    if (!password) { showError('请输入题库密码。'); return; }
    button.disabled = true;
    button.textContent = '正在解锁…';
    message.textContent = '';
    try {
      const passwordKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:bytesFromBase64(payload.salt), iterations:payload.iterations, hash:'SHA-256' }, passwordKey, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      const decrypted = await crypto.subtle.decrypt({ name:'AES-GCM', iv:bytesFromBase64(payload.iv) }, key, bytesFromBase64(payload.ciphertext));
      const html = new TextDecoder().decode(decrypted);
      document.open();
      document.write(html);
      document.close();
    } catch (_) {
      input.value = '';
      input.focus();
      showError('密码错误或加密内容无法读取，请重试。');
    }
  });
